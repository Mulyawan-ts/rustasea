# cargo-audit configuration (ADOPT-030).
#
# Mirrors the advisory allow-list in deny.toml so `cargo audit` (CI `audit` job)
# and `cargo deny check advisories` agree on the accepted exceptions.

[advisories]
# Documented, reviewed exceptions only.
ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack" timing sidechannel in `rsa`.
    # No patched release exists (upstream RustCrypto/RSA#626 still open as of
    # 2026-09; `patched = []` is intentional). `rsa` is an unconditional
    # transitive dependency of `jsonwebtoken`'s `rust_crypto` feature and cannot
    # be disabled; the vulnerable RSA code path is never reached because
    # rustasea-auth uses HS256 (HMAC-SHA256) exclusively. Accepted risk.
    "RUSTSEC-2023-0071",
]
