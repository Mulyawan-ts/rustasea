[build]
rustc-wrapper = "/home/vheins/.cargo/bin/sccache"

[env]
SCCACHE_CACHE_SIZE = "2G"
CARGO_INCREMENTAL = "0"

# Convenience alias so the documented `cargo xtask <task>` surface works without
# a separate `cargo-xtask` binary (ADOPT-030). Expands to `cargo run -p xtask --`.
[alias]
xtask = "run -p xtask --"