# Database connection settings (M2). Loaded by rustasea-orm from the process
# working directory (workspace root). The `DATABASE_URL` environment variable
# overrides the resolved URL at runtime, matching the FSD FS-M2-01 contract.
#
# Two shapes are supported and may coexist:
#   * legacy flat `url` below — still honoured for single-connection apps;
#   * named `[database.connections.<name>]` tables selected by `default`.

[database]
# Connection used when no name is requested (CLI/xtask resolve the default).
default = "sqlite"
# Legacy flat connection — kept for backward compatibility. When
# `[database.connections]` is absent this is synthesized into an implicit
# `default` connection; when present it is ignored in favour of the named map.
url = "sqlite://database.sqlite?mode=rwc"
# Pool tuning shared by connections that do not override `[….pool]`.
pool = { min = 1, max = 10, idle_timeout = 600 }

# A full `url` may be supplied instead of granular fields. The `driver` key is
# validated against the URL scheme, so a mismatch is a typed error.
[database.connections.sqlite]
driver = "sqlite"
url = "sqlite://database.sqlite?mode=rwc"

# Granular fields build the URL per driver (`postgres://user:pass@host:port/db`).
[database.connections.pgsql]
driver = "postgres"
host = "127.0.0.1"
port = 5432
database = "rustasea"
username = "rustasea"
password = "secret"
# charset optional

# Optional read/write splitting (Laravel-style). Declare a `[….read]` (and/or
# `[….write]`) table to route SELECTs to a replica while mutations always hit
# the primary. Omitted endpoint fields fall back to the primary, so a replica
# sharing credentials only needs its own `host`. A full `read.url` may replace
# the whole endpoint. With no `[….read]` table, reads and writes share one pool.
[database.connections.pgsql.read]
host = "replica.internal"
port = 5432
# database/username/password/charset inherit from the primary above.
# url = "postgres://rustasea:secret@replica.internal:5432/rustasea"  # alt form

[database.connections.mysql]
driver = "mysql"
host = "127.0.0.1"
port = 3306
database = "rustasea"
username = "rustasea"
password = "secret"

# MongoDB (document store) via the shared named-connections resolver. Requires
# the `mongodb` feature on `rustasea-orm`; without it, resolving this connection
# returns a typed `UnsupportedDriver` error (never a panic). Supply a full `uri`
# (`mongodb://` or `mongodb+srv://`) or the granular host/port/database fields,
# which build a `mongodb://host:port/database` URI (port defaults to 27017). The
# `MONGODB_URI` env var overrides `uri` and `MONGODB_DATABASE` overrides
# `database` (see `rustasea_mongo::MongoConfig::from_parts`). `config/mongo.toml`
# remains the standalone MongoDB config; both surfaces are supported.
[database.connections.mongo]
driver = "mongodb"
uri = "mongodb://127.0.0.1:27017"
database = "rustasea"
# Granular alternative (mutually exclusive with `uri`):
# host = "127.0.0.1"
# port = 27017
# database = "rustasea"
# username = "rustasea"
# password = "secret"
# Per-connection pool tuning is forwarded to the Mongo driver:
# pool = { min = 1, max = 10, idle_timeout = 600 }

# ---------------------------------------------------------------------------
# Migrations (Laravel `database.php` `migrations` section). Consumed by the ORM
# `Migrator`: `table` names the tracking table that records each applied
# migration and its batch. `update_date_on_publish` is parsed for Laravel
# parity (RustaSea stamps `executed_at` on apply, so it is currently advisory).
# ---------------------------------------------------------------------------
[database.migrations]
table = "migrations"
update_date_on_publish = true

# ---------------------------------------------------------------------------
# Redis (Laravel `database.php` `redis` section). These are connection
# *definitions* the cache/queue configs reference by name (`default`, `cache`);
# the ORM only parses and validates them and never opens a Redis socket itself.
#
# `client` selects the backend. RustaSea uses `deadpool`, mapping onto Laravel's
# `phpredis`/`predis` selector. `options` mirrors Laravel's shared `options`
# block: `cluster` is the cluster backend (`redis`, `predis`, …), `prefix` is
# applied to every key, and `persistent` keeps connections open across requests.
#
# A full `url` wins over the granular `host`/`port`/`database` fields; the
# scheme must be `redis://`/`rediss://` (or `unix://`) or parsing fails with a
# typed error. `database` is the logical Redis DB index. `max_retries` and the
# `backoff_*` keys describe the reconnect policy (algorithm name, base delay in
# milliseconds, and cap).
# ---------------------------------------------------------------------------
[database.redis]
client = "deadpool"

[database.redis.options]
cluster = "redis"
prefix = "rustasea-database-"
persistent = false

# Primary Redis connection (Laravel `default`), logical DB 0.
[database.redis.default]
url = "redis://127.0.0.1:6379/0"
host = "127.0.0.1"
port = 6379
# username = ""   # Laravel REDIS_USERNAME (Redis 6 ACL)
# password = ""   # Laravel REDIS_PASSWORD
database = 0
max_retries = 3
backoff_algorithm = "exponential"
backoff_base = 100
backoff_cap = 1000

# Cache Redis connection (Laravel `cache`), logical DB 1 so cache keys never
# collide with the primary connection's keys.
[database.redis.cache]
url = "redis://127.0.0.1:6379/1"
host = "127.0.0.1"
port = 6379
# username = ""   # Laravel REDIS_USERNAME (Redis 6 ACL)
# password = ""   # Laravel REDIS_PASSWORD
database = 1
max_retries = 3
backoff_algorithm = "exponential"
backoff_base = 100
backoff_cap = 1000
