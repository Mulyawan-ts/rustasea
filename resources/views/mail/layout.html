<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}RustaSea{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:8px;padding:32px;">
          <tr>
            <td>
              <h1 style="margin:0 0 16px;font-size:22px;">{% block heading %}{% endblock %}</h1>
              {% block content %}{% endblock %}
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0;font-size:12px;color:#7b8794;">
          {% block footer %}Served by RustaSea on axum{% endblock %}
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
