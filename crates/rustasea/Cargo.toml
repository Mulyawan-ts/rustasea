[package]
name = "rustasea"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustasea-foundation = { path = "../rustasea-foundation" }
rustasea-config = { path = "../rustasea-config" }
rustasea-router = { path = "../rustasea-router" }
rustasea-http = { path = "../rustasea-http" }
rustasea-macros = { path = "../rustasea-macros" }
rustasea-orm = { path = "../rustasea-orm" }
# OpenAPI 3.1 generation from the live route table (ADOPT-011).
rustasea-openapi = { path = "../rustasea-openapi" }
# Activity log / audit trail (M2): model-change history with causer + diffs.
rustasea-activitylog = { path = "../rustasea-activitylog" }
# Authentication log (ADOPT-003): login/logout/failed/lockout history with an
# optional queued new-device notification.
rustasea-authlog = { path = "../rustasea-authlog" }
rustasea-auth = { path = "../rustasea-auth" }
rustasea-validation = { path = "../rustasea-validation" }
rustasea-queue = { path = "../rustasea-queue" }
rustasea-cache = { path = "../rustasea-cache" }
rustasea-events = { path = "../rustasea-events" }
rustasea-schedule = { path = "../rustasea-schedule" }
# Internationalization (M3): TOML/JSON dictionaries, `__` / `trans_choice`.
rustasea-i18n = { path = "../rustasea-i18n" }
# Timezone mapper (ADOPT-006): user-timezone resolution + wall-clock helpers.
rustasea-timezone = { path = "../rustasea-timezone" }
rustasea-cli = { path = "../rustasea-cli" }
rustasea-testing = { path = "../rustasea-testing" }
# M6 advanced crates (Sprint 07). rustasea-ai is opt-in (NFR-Sca-02):
# core builds never pull AI/provider SDKs without the `ai` feature.
rustasea-broadcast = { path = "../rustasea-broadcast" }
rustasea-storage = { path = "../rustasea-storage" }
rustasea-search = { path = "../rustasea-search" }
rustasea-jsonapi = { path = "../rustasea-jsonapi" }
rustasea-ai = { path = "../rustasea-ai", optional = true }
# MongoDB document store (ADR-0010); opt-in so the core build never links the
# `mongodb`/`bson` driver tree (pay-for-what-you-use, NFR-Sca-02).
rustasea-mongo = { path = "../rustasea-mongo", optional = true }
# M6 server-side view layer (askama default); opt-in to preserve
# pay-for-what-you-use (blueprint §3).
rustasea-view = { path = "../rustasea-view", optional = true }
# M6/M7 Inertia protocol + starter-kit surface (ADR-0002). Every crate stays
# optional so the core never links a template engine, WASM framework, or the
# scaffolder unless a feature selects it.
rustasea-inertia = { path = "../rustasea-inertia", optional = true }
rustasea-inertia-client = { path = "../rustasea-inertia-client", optional = true }
rustasea-inertia-adapters = { path = "../rustasea-inertia-adapters", optional = true }
rustasea-livewire = { path = "../rustasea-livewire", optional = true }
rustasea-scaffold = { path = "../rustasea-scaffold", optional = true }
# Logging facade (CFG-005): Laravel-style `logging.toml` channels on tracing.
# Opt-in so the core build never links the tracing subscriber tree
# (pay-for-what-you-use, NFR-Sca-02).
rustasea-logging = { path = "../rustasea-logging", optional = true }
# Dev request profiler / debug toolbar (ADOPT-009). Opt-in so the core build
# never links the profiler; the app enables it via its own `debugbar` feature.
rustasea-debugbar = { path = "../rustasea-debugbar", optional = true }

[features]
default = []
# Server-side views (askama compile-time templates).
view = ["dep:rustasea-view"]
# Forward the runtime engine feature for dev hot-reload / user-authored views.
view-runtime-templates = ["view", "rustasea-view/runtime-templates"]
# Inertia server protocol (axum glue enabled by the crate's default `server`).
inertia = ["dep:rustasea-inertia"]
# Framework-agnostic Inertia WASM client protocol surface.
inertia-client = ["dep:rustasea-inertia-client"]
# Inertia WASM presentation adapter — React variant mapped to Dioxus (ADR-0002 §4).
wasm-dioxus = [
    "inertia-client",
    "dep:rustasea-inertia-adapters",
    "rustasea-inertia-adapters/react",
]
# Inertia WASM presentation adapter — Vue variant mapped to Leptos (ADR-0002 §4).
wasm-leptos = [
    "inertia-client",
    "dep:rustasea-inertia-adapters",
    "rustasea-inertia-adapters/vue",
]
# Livewire analogue: askama components, HTMX swaps, broadcast realtime (ADR-0002 §5).
livewire = ["view", "dep:rustasea-livewire"]
# Starter-kit scaffolder behind `cargo rustasea new` (ADR-0002 §6).
scaffold = ["dep:rustasea-scaffold"]
# M6 AI SDK is additive; `ai-search`/`ai-storage`/`ai-mcp` forward the
# deferred-loader features of rustasea-ai itself.
ai = ["dep:rustasea-ai"]
ai-search = ["dep:rustasea-ai", "rustasea-ai/search"]
ai-storage = ["dep:rustasea-ai", "rustasea-ai/storage"]
ai-mcp = ["dep:rustasea-ai", "rustasea-ai/mcp"]
# MongoDB document store (ADR-0010). Opt-in so the core build never links the
# `mongodb`/`bson` driver tree (NFR-Sca-02).
mongo = ["dep:rustasea-mongo"]
# Logging facade (CFG-005). Opt-in so the core build never links the tracing
# subscriber/appender tree (NFR-Sca-02).
logging = ["dep:rustasea-logging"]
# Sentry error tracking (ADOPT-004). Forwards the `sentry` feature to the HTTP
# request-context middleware and the logging facade's Sentry layer/client.
# Opt-in (NFR-Sca-02).
sentry = ["rustasea-http/sentry", "rustasea-logging/sentry"]
# Dev request profiler / debug toolbar (ADOPT-009). Opt-in so the core build
# never links the profiler; consumers re-export the crate as `debugbar`.
debugbar = ["dep:rustasea-debugbar"]
# Composite: every server-side presentation layer plus the scaffolder. The WASM
# variants stay opt-in because an app selects exactly one (ADR-0002 §4), and
# `ai` is excluded so `full` never pulls provider SDKs (NFR-Sca-02).
full = [
    "view",
    "view-runtime-templates",
    "inertia",
    "inertia-client",
    "livewire",
    "scaffold",
]
# Real Docker-backed feature tests (testcontainers + Postgres). Off by default
# so the default `cargo test` never requires Docker.
integration = ["rustasea-testing/postgres", "rustasea-orm/postgres"]

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
