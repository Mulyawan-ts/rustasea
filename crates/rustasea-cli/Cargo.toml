[package]
name = "rustasea-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustaSea Artisan-like CLI — clap + xtask, list, make:* generators, prompts, Artisan::call, Shutdownable."

# Cargo convention: a binary named `cargo-artisan` makes the crate's CLI
# invocable as `cargo artisan <command>` (mirroring `php artisan`). The
# package stays `rustasea-cli` so `cargo run -p rustasea-cli` keeps working.
[[bin]]
name = "cargo-artisan"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# `dep:rustasea-router` backs the `routes` registry that `route:list` reads
# (see `src/routes.rs`); it stays optional so a core build that only needs the
# command registry never links axum.
cli = [
    "dep:clap",
    "dep:dialoguer",
    "dep:indicatif",
    "dep:console",
    "dep:comfy-table",
    "dep:rustyline",
    "dep:rustasea-router",
    "dep:rustasea-openapi",
    "dep:rustasea-i18n",
]
# `mcp:serve` exposes the project knowledge over the Model Context Protocol
# (laravel/boost parity). Implies `cli` (the command registry lives there) and
# pulls `rustasea-ai` with its server engine enabled.
mcp = ["cli", "dep:rustasea-ai", "rustasea-ai/mcp", "dep:toml"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v7"] }
thiserror = { workspace = true }
async-trait = { workspace = true }
strsim = { workspace = true }
rustasea-foundation = { path = "../rustasea-foundation" }
rustasea-config = { path = "../rustasea-config" }
# `log:show` reads the on-disk log file through the logging facade's reader
# module (parse/filter/resolve/tail), so the crate is a direct dependency.
rustasea-logging = { path = "../rustasea-logging" }
rustasea-queue = { path = "../rustasea-queue" }
rustasea-schedule = { path = "../rustasea-schedule" }
rustasea-macros = { path = "../rustasea-macros" }
rustasea-orm = { path = "../rustasea-orm" }
# `route:list` reads the application route table (`RouteEntry`); optional so the
# router/axum tree is only linked with the `cli` feature.
rustasea-router = { path = "../rustasea-router", optional = true }
# `openapi:generate` turns the same route table into an OpenAPI 3.1 document;
# optional so a core build that only needs the command registry never links it.
rustasea-openapi = { path = "../rustasea-openapi", optional = true }
# `lang:check` reads translation dictionaries through the i18n loader; optional
# so a core build that never checks locales does not link the i18n tree.
rustasea-i18n = { path = "../rustasea-i18n", optional = true }
# `mcp:serve` runs the MCP server engine (protocol + backend trait); optional so
# a build without the `mcp` feature never links the AI tree.
rustasea-ai = { path = "../rustasea-ai", optional = true }
# TOML parsing for `mcp:serve` config resources (`config/*.toml` → redacted JSON).
toml = { version = "0.8", optional = true }
clap = { workspace = true, optional = true }
dialoguer = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
console = { workspace = true, optional = true }
comfy-table = { workspace = true, optional = true }
# Readline backend for the interactive `tinker` REPL (line editing, history).
rustyline = { workspace = true, optional = true }

[dev-dependencies]
# The `mcp_serve` round-trip test drives the real binary through the MCP client
# (feature `mcp`), so the client engine is available to the test crate.
rustasea-ai = { path = "../rustasea-ai", features = ["mcp"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# `log:show` tests build fixture log files in throwaway temp directories.
tempfile = "3"
