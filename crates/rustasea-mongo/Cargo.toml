[package]
name = "rustasea-mongo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustaSea Mongo — MongoDB document store: typed client, Document contract, CRUD helpers, filter/update builders"

[dependencies]
# Driver is pinned to bson 3 (`bson-3`) so the workspace has a single BSON
# version shared by the driver and this crate. `compat-3-3-0` is mandatory per
# the driver's own forward-compatibility compile check.
mongodb = { workspace = true }
bson = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
bson = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
