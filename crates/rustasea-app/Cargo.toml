# Runnable example app — README members = ["crates/*"]; the app is a crate
# like any other, with `cargo run -p rustasea-app` / `cargo dev` serving the
# example HTTP application. No [[bin]] needed: Cargo auto-detects
# `src/main.rs` as the default binary target.
[package]
name = "rustasea-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "RustaSea runnable app scaffold — `cargo dev` serves the example HTTP application."

[dependencies]
# `view` exposes the view layer (`ViewResponse`, `ViewEngine`); the forwarded
# `view-runtime-templates` feature enables the runtime minijinja engine the app
# renders `resources/views/*.html` with.
rustasea = { path = "../rustasea", features = ["view", "view-runtime-templates"] }
tokio = { workspace = true }
axum = { workspace = true }
anyhow = "1"
serde = { workspace = true, features = ["derive"] }
# `ServeDir` serves `resources/` at `/assets/*`; `fs` is the file-service feature.
tower-http = { workspace = true, features = ["fs"] }
# `tower_sessions::cookie::Cookie` parses the session cookie the auth
# middleware reads; `rustasea-auth` builds the guard over the same 0.15 line.
tower-sessions = { workspace = true }

[dev-dependencies]
# `ServiceExt::oneshot` drives the compiled router in route tests.
tower = { workspace = true, features = ["util"] }
