# Runnable example app — README members = ["crates/*"]; the app is a crate
# like any other, with `cargo run -p rustasea-app` / `cargo dev` serving the
# example HTTP application. No [[bin]] needed: Cargo auto-detects
# `src/main.rs` as the default binary target.
[package]
name = "rustasea-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "RustaSea runnable app scaffold — `cargo dev` serves the example HTTP application."

[features]
# Sentry error tracking (ADOPT-004): forwards the `sentry` feature to the HTTP
# request-context middleware and the logging subscriber's Sentry layer/client.
# Off by default so the standard `cargo run -p rustasea-app` links no Sentry SDK.
default = []
sentry = ["rustasea-http/sentry", "rustasea-logging/sentry"]
# Dev request profiler / debug toolbar (ADOPT-009). Off by default so the
# standard `cargo run -p rustasea-app` links neither the profiler nor its
# `/_debugbar` surface; the app installs the hooks at boot and mounts the
# middleware + routes only when this feature is on.
debugbar = ["dep:rustasea-debugbar"]

[dependencies]
# `view` exposes the view layer (`ViewResponse`, `ViewEngine`); the forwarded
# `view-runtime-templates` feature enables the runtime minijinja engine the app
# renders `resources/views/*.html` with.
rustasea = { path = "../rustasea", features = ["view", "view-runtime-templates"] }
# `/openapi.json` generates the spec from the live route table; `/docs` serves
# the Scalar UI over it (both dev-only).
rustasea-openapi = { path = "../rustasea-openapi" }
tokio = { workspace = true }
axum = { workspace = true }
anyhow = "1"
serde = { workspace = true, features = ["derive"] }
# `serde_json::Value` renders config values for the `tinker` REPL source.
serde_json = { workspace = true }
# `ServeDir` serves `resources/` at `/assets/*`; `fs` is the file-service feature.
tower-http = { workspace = true, features = ["fs"] }
# `tower_sessions::cookie::Cookie` parses the session cookie the auth
# middleware reads; `rustasea-auth` builds the guard over the same 0.15 line.
tower-sessions = { workspace = true }
# `rustasea-mail` supplies the `Mailable`/`Mailer` contracts the email
# verification flow (AUTH-014) renders and delivers through. The `rustasea`
# facade does not re-export it, so it is a direct dependency. The `templates`
# feature (AUTH-018) adds the `rustasea-view`-backed rendering hook so auth
# emails render branded HTML from `resources/views/mail/`.
rustasea-mail = { path = "../rustasea-mail", features = ["templates"] }
# Authentication-log recorder (ADOPT-003): the login/logout handlers emit
# sign-in events through the process-wide logger installed by this crate.
rustasea-authlog = { path = "../rustasea-authlog" }
# `chrono` stamps the `email_verified_at` timestamp (RFC 3339).
chrono = { workspace = true }
# `uuid::Uuid::now_v7` generates a request id for the error middleware
# (ADOPT-010) when a request carries no `x-request-id` header.
uuid = { workspace = true }
# `sha2` + `hex` derive the `{hash}` segment of a signed verification URL
# (SHA-256 of the user's email, lowercase hex).
sha2 = { workspace = true }
hex = { workspace = true }
# The HTTP layer is a direct dependency so the app can install the Sentry
# request-context middleware (ADOPT-004) and the facade does not have to
# re-export every middleware symbol.
rustasea-http = { path = "../rustasea-http" }
# The logging facade is a direct dependency so the app can install the global
# `tracing` subscriber at boot (`init_from_config`), fixing the gap where the
# re-export was never called at runtime (CFG-005 / ADOPT-004).
rustasea-logging = { path = "../rustasea-logging" }
# Dev request profiler / debug toolbar (ADOPT-009). A direct, optional dependency
# so the app can install the profiler hooks at boot and mount the `/_debugbar`
# routes + middleware when the `debugbar` feature is on.
rustasea-debugbar = { path = "../rustasea-debugbar", optional = true }

[dev-dependencies]
# `ServiceExt::oneshot` drives the compiled router in route tests.
tower = { workspace = true, features = ["util"] }
