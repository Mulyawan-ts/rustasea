[package]
name = "rustasea-activitylog"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "RustaSea activity log — model-change audit trail with causer/subject, property diffs, and batch grouping"

[features]
# `sqlite` is the default so `cargo test -p rustasea-activitylog` runs against an
# in-memory database with no server; Postgres/MySQL are forwarded to the ORM's
# own driver features.
default = ["sqlite"]
sqlite = ["rustasea-orm/sqlite"]
postgres = ["rustasea-orm/postgres"]
mysql = ["rustasea-orm/mysql"]

[dependencies]
rustasea-orm = { path = "../rustasea-orm", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
