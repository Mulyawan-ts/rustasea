[package]
name = "rustasea-orm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustaSea ORM — models, fluent query builder, migrations, factories, vector support"

[features]
# `sqlite` is the default so `cargo test -p rustasea-orm` runs against an
# in-memory database with no server. Postgres/MySQL are opt-in and forwarded to
# the `sqlx` driver features.
default = ["sqlite"]
# Driver dialects — realised as real `sqlx` driver features.
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
sqlite = ["sqlx/sqlite"]
# pgvector support (whereVectorSimilarTo, vector column type). Enables the
# `pgvector` crate's `sqlx` integration so a `Vector` binds/decodes natively on
# Postgres; SQLite/MySQL keep the portable text representation.
vector = ["dep:pgvector", "pgvector/sqlx"]
# MongoDB document store through the shared named-connections resolver. Opt-in
# so a SQL-only app never compiles the `mongodb` driver; `rustasea-mongo` is the
# optional dependency this feature activates.
mongodb = ["dep:rustasea-mongo"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
# Config-driven named connections: the ORM owns parsing of the `[database]`
# table, reading it through the shared layered loader.
rustasea-config = { path = "../rustasea-config" }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
async-trait = { workspace = true }
# Authenticated encryption for the `encrypted` attribute cast (ChaCha20-Poly1305)
# and its key derivation (SHA-256); the hex envelope reuses the workspace codec.
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# RFC 3986 percent-encoding for credentials interpolated into connection URLs.
percent-encoding = "2"
# Unicode→ASCII transliteration for slug generation (ADOPT-016).
deunicode = { workspace = true }
# Runtime API only — the compile-time `query!` macros are intentionally not
# enabled (CI has no `DATABASE_URL`). Driver features are added via `[features]`.
sqlx = { workspace = true }
# Native pgvector type + sqlx `Encode`/`Decode` for `Postgres` (feature `vector`).
pgvector = { version = "0.4", optional = true, default-features = false }
# MongoDB document store (feature `mongodb`). Optional so SQL-only builds stay
# free of the driver; the connections resolver gates all uses behind the feature.
rustasea-mongo = { path = "../rustasea-mongo", optional = true }

[dev-dependencies]
rustasea-macros = { path = "../rustasea-macros" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
# Integration tests parse the assembled connection URLs to prove credentials
# with reserved characters stay within the authority.
url = "2"
