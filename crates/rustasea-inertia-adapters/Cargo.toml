[package]
name = "rustasea-inertia-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "RustaSea Inertia WASM presentation adapters — Dioxus (react), Leptos (vue), and Sycamore (svelte) variants"

[dependencies]
# Protocol-only client: Page<T> parsing, the generated ComponentRegistry, and
# the Inertia navigation decision logic shared by both WASM variants.
rustasea-inertia-client = { path = "../rustasea-inertia-client" }
# Protocol types/constants shared with the client; the axum glue stays off so
# this crate remains WASM-safe.
rustasea-inertia = { path = "../rustasea-inertia", default-features = false }
http = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Browser transport (Inertia visit + hard navigation), shared by both variants.
# Only the `http` transport is needed — websocket/eventsource are not.
gloo-net = { version = "0.7", default-features = false, features = ["http"], optional = true }
web-sys = { version = "0.3", features = ["Window", "Location"], optional = true }

# Variant frameworks: `react` maps to Dioxus, `vue` maps to Leptos, and `svelte`
# maps to Sycamore (ADR-0002 §4).
dioxus = { version = "0.7", default-features = false, features = ["web", "lib"], optional = true }
leptos = { version = "0.8", default-features = false, features = ["csr"], optional = true }
sycamore = { version = "0.9", default-features = false, features = ["web"], optional = true }
# Sycamore's `web` feature alone exposes no async spawn, so the `svelte` variant
# drives its Inertia visit through `wasm-bindgen-futures::spawn_local` directly.
wasm-bindgen-futures = { version = "0.4", optional = true }

[features]
# No framework is linked unless a variant is selected: a Blade/Livewire app
# never pulls WASM code (ADR-0002 zero-cost ergonomics).
default = []
# `react` variant → Dioxus.
react = ["dep:dioxus", "dep:gloo-net", "dep:web-sys"]
# `vue` variant → Leptos.
vue = ["dep:leptos", "dep:gloo-net", "dep:web-sys"]
# `svelte` variant → Sycamore.
svelte = ["dep:sycamore", "dep:gloo-net", "dep:web-sys", "dep:wasm-bindgen-futures"]

# wasm-pack build profile used by the generated `resources/js` entrypoint
# (the library itself is consumed by the app's binary target).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals"]
