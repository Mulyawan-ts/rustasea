[package]
name = "rustasea-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustaSea testing harness — TestCase, testcontainers isolation, factory sequence resets, paginator views."

[features]
default = ["containers"]
containers = ["dep:dotenvy", "dep:testcontainers"]
# Isolated Postgres fixtures built on the real testcontainers helpers.
postgres = ["containers", "rustasea-orm/postgres"]
# Reusable auth test helpers: session guard login/assertions + the Fortify
# feature gate. `tokio` is an unconditional dependency (the default test build
# already needs it for `#[tokio::test]`), so this feature only pulls the auth
# crate itself.
auth = ["dep:rustasea-auth"]
# Reusable HTTP test client: drive an `axum::Router` through a single
# `tower::ServiceExt::oneshot` and decode the JSON response.
http = ["dep:axum", "dep:tower", "dep:http-body-util", "dep:serde_json"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
thiserror = { workspace = true }
async-trait = { workspace = true }
rustasea-foundation = { path = "../rustasea-foundation" }
rustasea-config = { path = "../rustasea-config" }
rustasea-orm = { path = "../rustasea-orm" }
rustasea-cache = { path = "../rustasea-cache" }
# Testing fakes (LARAVEL-015) intercept the real Mail/Queue/Events seams, so the
# fake types in `src/fakes.rs` depend on the contracts they substitute.
rustasea-events = { path = "../rustasea-events" }
rustasea-queue = { path = "../rustasea-queue" }
rustasea-mail = { path = "../rustasea-mail" }
dotenvy = { workspace = true, optional = true }
testcontainers = { version = "0.23", optional = true }
rustasea-auth = { path = "../rustasea-auth", optional = true }
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
http-body-util = { version = "0.1", optional = true }
