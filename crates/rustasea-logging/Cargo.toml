[package]
name = "rustasea-logging"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustaSea logging — Laravel-style logging.toml channels mapped onto tracing"

[features]
# Sentry error tracking (ADOPT-004). Opt-in so the core build never links the
# Sentry SDK tree (pay-for-what-you-use, NFR-Sca-02). The feature is inert until
# a DSN is configured: `sentry::init` returns `None` when disabled, and the
# `sentry-tracing` layer is a no-op while no client is bound.
default = []
sentry = ["dep:sentry", "dep:sentry-tracing", "dep:sentry-panic"]

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde = { workspace = true }
# `scrub_event` parses JSON request bodies into `serde_json::Value` (which is
# also `sentry::protocol::Value`) to redact nested credentials.
serde_json = { workspace = true }
thiserror = { workspace = true }
rustasea-config = { path = "../rustasea-config" }
# Sentry SDK (ADOPT-004). Default features are disabled so the transport is
# chosen explicitly (`reqwest` + `rustls`); `panic`/`tracing`/`contexts`/
# `debug-images` supply the integrations wired by `crate::sentry`.
sentry = { version = "0.49", default-features = false, features = [
    "reqwest",
    "rustls",
    "backtrace",
    "panic",
    "tracing",
    "contexts",
    "debug-images",
], optional = true }
sentry-tracing = { version = "0.49", optional = true }
sentry-panic = { version = "0.49", optional = true }

[dev-dependencies]
tempfile = "3"
