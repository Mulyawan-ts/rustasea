[package]
name = "rustasea-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustaSea storage — read-through disk Storage, path confinement, local disk"

[dependencies]
async-trait = { workspace = true }
object_store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
# Pure-Rust SSH client for the opt-in `sftp` disk (ADOPT-025). Default features
# are disabled and `ring` (already in the lock via `rustls`) is selected as the
# crypto backend so no C/OpenSSL toolchain is required; `rsa` keeps RSA host
# keys and RSA private keys usable. `russh-sftp` speaks the SFTP subsystem over
# a caller-supplied stream (no direct `russh` dependency), pairing with the
# `russh` 0.62 line.
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }

[features]
default = []
# Cloud disk drivers; each forwards to the matching `object_store` backend.
aws = ["object_store/aws"]
gcp = ["object_store/gcp"]
azure = ["object_store/azure"]
# SFTP disk driver (pure-Rust `russh` + `russh-sftp`).
sftp = ["dep:russh", "dep:russh-sftp"]

[dev-dependencies]
# Docker-backed SFTP integration tests (`tests/sftp_container.rs`), run only
# with `--features sftp -- --ignored`.
testcontainers = { workspace = true }
