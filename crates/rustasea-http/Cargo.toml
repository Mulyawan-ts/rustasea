[package]
name = "rustasea-http"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP layer for RustaSea — AppState, middleware, and HTTP client"

[features]
# Sentry request-context middleware (ADOPT-004). Opt-in so the core build never
# links the Sentry SDK tree (NFR-Sca-02). With no client bound the middleware's
# `sentry` calls are no-ops.
default = []
sentry = ["dep:sentry"]

[dependencies]
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["catch-panic"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
rustasea-router = { path = "../rustasea-router" }
# Sentry SDK (ADOPT-004). Default features are disabled; the middleware only
# needs the core client + protocol types. The `panic`/`contexts`/`debug-images`
# integrations match `rustasea-logging`'s client so the two stay in lockstep.
sentry = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
