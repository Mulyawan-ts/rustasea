[package]
name = "rustasea-scaffold"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustaSea starter-kit scaffolder — emits the shared core plus the blade/react/vue/livewire presentation tree"

[dependencies]
# Typed, source-attributed errors for every scaffold failure mode.
thiserror = { workspace = true }
# `Generated` is serializable so the `cargo-rustasea` binary can offer --json.
serde = { workspace = true }

[dev-dependencies]
# Integration tests parse the generated `config/*.toml` so a malformed template
# fails in CI rather than in a generated application.
toml = { workspace = true }
