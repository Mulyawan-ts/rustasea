[package]
name = "rustasea-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustaSea authentication and security — JWT/session guards, origin-aware CSRF, throttling"

[dependencies]
rustasea-config = { path = "../rustasea-config" }
rustasea-foundation = { path = "../rustasea-foundation" }
rustasea-http = { path = "../rustasea-http" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
chacha20poly1305 = { workspace = true }
# Passkeys / WebAuthn (AUTH-017): ES256 verification + CBOR + base64url.
p256 = { workspace = true }
ciborium = { workspace = true }
base64 = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }
tower-sessions = { workspace = true }
async-trait = { workspace = true }
rustasea-orm = { path = "../rustasea-orm" }
time = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
subtle = { workspace = true }
